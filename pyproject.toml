[project]
name = "taqa-maximo-integrated-buildout"
version = "0.1.0"
description = "TAQA Bid Analyzer rebuilt against real Maximo data via Databricks, deployed as a Databricks App"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "python-dotenv>=1.2.2",
    "databricks-sql-connector>=3.0.0",
    "databricks-sdk>=0.30.0",
    "openpyxl>=3.1.5",
]

[tool.pytest.ini_options]
# `.` on the path so `backend` and `tests` import without installing the
# project, which is how the app itself runs under start.sh.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "frontend", "data", "archieved", "src"]

[tool.ruff.lint]
# Deliberately narrow. This is linting a working codebase late, so it
# catches real defects (undefined names, unused imports, bare excepts
# that hide a cause) without churning style across every file.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "E722",  # bare except is used on purpose in the fail-open overlay reads
    "B008",  # FastAPI dependencies are function calls in defaults by design
]
